# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # Populate default-branch dependency caches that later PRs can restore.
  # PR merge-ref caches are otherwise private to that individual PR.
  push:
    branches: [main]
  pull_request:
    branches: [r_package, develop, main]
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  fedora-gcc16:
    runs-on: ubuntu-latest
    name: Fedora GCC 16 (R-devel)
    container:
      image: ghcr.io/r-hub/containers/gcc16:latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: /root/R-libs
          key: rduckhts-fedora-gcc16-${{ hashFiles('r/Rduckhts/DESCRIPTION') }}
          restore-keys: |
            rduckhts-fedora-gcc16-

      - name: Build and check in the CRAN Fedora environment
        env:
          DUCKHTS_FEDORA_CONTAINER: 1
        run: bash scripts/check_cran_fedora.sh

  fedora-clang:
    runs-on: ubuntu-latest
    name: Fedora 44 Clang 22 (CRAN-like)
    container:
      # Pinned Fedora 44 image; see scripts/check_cran_fedora.sh for the
      # compiler and CRAN-configuration receipt.
      image: fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898

    steps:
      - uses: actions/checkout@v4

      - name: Cache Fedora Clang R dependencies
        uses: actions/cache@v4
        with:
          path: /root/R-libs
          # Never reuse a library built under another image/R/compiler profile.
          key: rduckhts-fedora-clang-${{ runner.arch }}-${{ hashFiles('.github/workflows/cran-check.yml', 'scripts/check_cran_fedora*.sh', 'r/Rduckhts/DESCRIPTION') }}

      - name: Build and check with warnings promoted to errors
        env:
          DUCKHTS_FEDORA_CONTAINER: 1
          DUCKHTS_FEDORA_PROFILE: clang
        run: bash scripts/check_cran_fedora_clang.sh

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release', rtools: '45'}
          - {os: windows-2022,   r: 'devel', rtools: '45'}
          - {os: windows-2022,   r: '4.5.3', rtools: '45'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
         # - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          rtools-version: ${{ matrix.config.rtools }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Verify Windows R 4.5.3 runtime
        if: matrix.config.os == 'windows-2022' && matrix.config.r == '4.5.3'
        shell: Rscript {0}
        run: |
          stopifnot(identical(as.character(getRversion()), "4.5.3"))
          print(R.version.string)
          print(Sys.info()[c("sysname", "release", "version", "machine")])

      #- name: Install system dependencies (macOS)
      #  if: runner.os == 'macOS'
      #  run: |
      #    brew install pkg-config curl gsl libdeflate bzip2 xz openssl

      - name: Reproduce CRAN M1Mac conversion diagnostics
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "DUCKHTS_CFLAGS=$(R CMD config CFLAGS) -Wconversion -Wno-sign-conversion" >> "$GITHUB_ENV"

      - name: Enable strict Windows native diagnostics
        if: runner.os == 'Windows'
        shell: bash
        run: echo "DUCKHTS_STRICT_WARNINGS=1" >> "$GITHUB_ENV"

      - name: Enable Windows Server 2022 crash dumps
        if: matrix.config.os == 'windows-2022'
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "r-crash-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          foreach ($executable in @("R.exe", "Rterm.exe", "Rscript.exe")) {
            $key = "HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\$executable"
            New-Item -Force -Path $key | Out-Null
            New-ItemProperty -Force -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir | Out-Null
            New-ItemProperty -Force -Path $key -Name DumpType -PropertyType DWord -Value 1 | Out-Null
            New-ItemProperty -Force -Path $key -Name DumpCount -PropertyType DWord -Value 10 | Out-Null
          }

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::digest
          needs: check
          working-directory: r/Rduckhts

      - name: Run pinned and statistical Somalier campaigns
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: scripts/test_somalier_release_campaigns.sh

      - name: Capture original Windows Server 2022 native crashes
        if: matrix.config.os == 'windows-2022'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:GITHUB_PAT = ""
          $dumpDir = Join-Path $env:RUNNER_TEMP "r-crash-dumps"
          $toolsDir = Join-Path $env:RUNNER_TEMP "duckhts-procdump"
          $archive = Join-Path $env:RUNNER_TEMP "Procdump.zip"
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $archive
          $expectedHash = "5FE68E81632F13188930AFFFF20A9A9910170BAE654360850D3108CEAD708A2D"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "ProcDump download checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $toolsDir
          $procdump = Join-Path $toolsDir "procdump64.exe"
          $probeSource = Join-Path $env:RUNNER_TEMP "duckhts_crash_probe.c"
          $probe = Join-Path $env:RUNNER_TEMP "duckhts_crash_probe.exe"
          @'
          int main(void) {
              volatile int *pointer = 0;
              *pointer = 1;
              return 0;
          }
          '@ | Set-Content -Path $probeSource
          & gcc.exe -O0 $probeSource -o $probe
          if ($LASTEXITCODE -ne 0) { throw "Could not compile the native crash probe" }
          & $procdump -accepteula -e -x $dumpDir $probe
          $probeCode = $LASTEXITCODE
          for ($attempt = 0; $attempt -lt 10; $attempt++) {
            $probeDump = Get-ChildItem -Path $dumpDir -Filter "duckhts_crash_probe*.dmp" | Select-Object -First 1
            if ($probeDump) { break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $probeDump) { throw "ProcDump did not capture the crash probe (exit $probeCode)" }
          Write-Host "Crash probe captured (ProcDump exit $probeCode)"
          Remove-Item -Path $probeDump.FullName
          "GITHUB_PAT=" | Add-Content -Path $env:GITHUB_ENV
          exit 0

      - name: Verify crash-check environment
        if: matrix.config.os == 'windows-2022'
        shell: pwsh
        run: |
          if ($env:GITHUB_PAT) { throw "Do not include the CI token in native minidumps" }

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
          working-directory: r/Rduckhts

      - name: Replay full R 4.5.3 tinytest suite under CDB
        if: always() && matrix.config.os == 'windows-2022' && matrix.config.r == '4.5.3'
        timeout-minutes: 12
        shell: pwsh
        run: |
          $checkLibrary = "r/Rduckhts/check/Rduckhts.Rcheck"
          if (-not (Test-Path (Join-Path $checkLibrary "Rduckhts"))) {
            throw "No installed check library to replay"
          }
          $env:R_LIBS = (Resolve-Path $checkLibrary).Path
          $env:GITHUB_PAT = ""
          $marker = Join-Path $env:RUNNER_TEMP "duckhts-tinytest-replay-complete.txt"
          $env:DUCKHTS_REPLAY_MARKER = $marker
          Remove-Item -Path $marker -ErrorAction SilentlyContinue
          $dumpDir = Join-Path $env:RUNNER_TEMP "r-crash-dumps"
          $procdump = Join-Path $env:RUNNER_TEMP "duckhts-procdump/procdump64.exe"
          $exitSource = Join-Path $env:RUNNER_TEMP "duckhts_exit_probe.c"
          $exitProbe = Join-Path $env:RUNNER_TEMP "duckhts_exit_probe.exe"
          @'
          #include <windows.h>
          int main(void) {
              ExitProcess(0xC0000005u);
          }
          '@ | Set-Content -Path $exitSource
          & gcc.exe -O0 $exitSource -o $exitProbe
          if ($LASTEXITCODE -ne 0) { throw "Could not compile the process-exit probe" }
          & $procdump -accepteula -t -x $dumpDir $exitProbe
          $exitDump = Get-ChildItem -Path $dumpDir -Filter "duckhts_exit_probe*.dmp" | Select-Object -First 1
          Write-Host "Termination dump captured: $([bool]$exitDump)"
          if ($exitDump) { Remove-Item -Path $exitDump.FullName }

          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path $cdb)) { throw "Windows SDK debugger is unavailable" }
          $debuggerCommands = Join-Path $env:RUNNER_TEMP "duckhts-exit-debugger.txt"
          $debuggerLog = Join-Path $dumpDir "duckhts-exit-debugger.log"
          $debuggerDump = Join-Path $dumpDir "duckhts-exit-before-unload.dmp"
          $debuggerDumpArgument = $debuggerDump.Replace("\", "/")
          $onExit = 'j (@edx == 0xc0000005) \".echo DUCKHTS_EXIT_STATUS; k; .dump /m ' + $debuggerDumpArgument + '; gc\"; \"gc\"'
          @(
            'bu ntdll!NtTerminateProcess "' + $onExit + '"',
            'g'
          ) | Set-Content -Path $debuggerCommands
          & $cdb -G -logou $debuggerLog -cf $debuggerCommands $exitProbe
          if (-not (Test-Path $debuggerDump) -or
              -not (Select-String -Path $debuggerLog -Pattern "DUCKHTS_EXIT_STATUS" -Quiet)) {
            throw "Live debugger did not capture the explicit process-exit probe"
          }
          Remove-Item -Path $debuggerDump
          Remove-Item -Path $debuggerLog

          $rscript = (Get-Command Rscript.exe).Source
          $replay = Join-Path $env:RUNNER_TEMP "duckhts-tinytest-replay.R"
          @'
          if (!requireNamespace("tinytest", quietly = TRUE)) {
            stop("tinytest unavailable")
          }
          source("r/Rduckhts/tests/tinytest.R")
          writeLines("complete", Sys.getenv("DUCKHTS_REPLAY_MARKER"))
          '@ | Set-Content -Path $replay
          & $cdb -G -logou $debuggerLog -cf $debuggerCommands $rscript --vanilla $replay
          if (-not (Test-Path $marker)) {
            throw "Full tinytest replay failed or exited early; inspect the debugger log and dump"
          }
          if (Test-Path $debuggerDump) {
            throw "Full tinytest replay reached the access-violation exit status"
          }

      - name: Trace Windows Server 2022 BAM extraction after check failure
        if: failure() && matrix.config.os == 'windows-2022'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $checkLibrary = "r/Rduckhts/check/Rduckhts.Rcheck"
          if (-not (Test-Path (Join-Path $checkLibrary "Rduckhts"))) {
            Write-Host "No installed check library for BAM extraction trace"
            return
          }
          $env:R_LIBS = (Resolve-Path $checkLibrary).Path
          $env:GITHUB_PAT = ""
          $dumpDir = Join-Path $env:RUNNER_TEMP "r-crash-dumps"
          $procdump = Join-Path $env:RUNNER_TEMP "duckhts-procdump/procdump64.exe"
          $rscript = (Get-Command Rscript.exe).Source
          & $procdump -accepteula -e -x $dumpDir $rscript --vanilla scripts/diagnose_bam_extraction.R
          $code = $LASTEXITCODE
          Write-Host ("ProcDump exit code: {0} (0x{1:X8})" -f $code, ($code -band [long]0xFFFFFFFF))
          Get-ChildItem -Path $dumpDir -Filter "*.dmp" | Select-Object Name, Length
          exit $code

      - name: Collect Windows application crash events
        if: failure() && matrix.config.os == 'windows-2022'
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "r-crash-dumps"
          Get-WinEvent -FilterHashtable @{
            LogName = "Application"
            Id = 1000, 1001
            StartTime = (Get-Date).AddHours(-2)
          } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, ProviderName, Message |
            Out-File (Join-Path $dumpDir "application-events.txt")

      - name: Upload Windows Server 2022 crash evidence
        if: failure() && matrix.config.os == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: windows-r-${{ matrix.config.r }}-crash-evidence
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/r-crash-dumps/Rterm*.dmp
            ${{ runner.temp }}/r-crash-dumps/Rscript*.dmp
            ${{ runner.temp }}/r-crash-dumps/R.exe*.dmp
            ${{ runner.temp }}/r-crash-dumps/R_*.dmp
            ${{ runner.temp }}/r-crash-dumps/duckhts-exit-before-unload.dmp
            ${{ runner.temp }}/r-crash-dumps/duckhts-exit-debugger.log
            ${{ runner.temp }}/r-crash-dumps/application-events.txt
            r/Rduckhts/check

      - name: Verify htslib header diagnostics stay outside DuckHTS compilation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          install_log=$(find r/Rduckhts -type f -path '*/Rduckhts.Rcheck/00install.out' -print -quit)
          test -n "$install_log"
          extension_log=$(mktemp)
          awk '/Building DuckHTS extension/ { extension = 1 } extension { print }' "$install_log" > "$extension_log"
          test -s "$extension_log"
          if grep -E 'htslib/htslib/[^:]+:[0-9]+:[0-9]+: (warning|error):' "$extension_log"; then
            echo "vendored htslib header diagnostics leaked into DuckHTS compilation" >&2
            exit 1
          fi

  linux-arm64-package:
    name: Linux ARM64 package contract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DUCKHTS_STRICT_WARNINGS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rduckhts
          dependencies: '"hard"'
          extra-packages: any::tinytest
          install-pandoc: false

      - name: Build and audit clean source tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -f Rduckhts_*.tar.gz
          R CMD build --no-manual r/Rduckhts
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          Rscript scripts/audit_rduckhts_source_tarball.R "$tarball"

      - name: Install source tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD INSTALL "$tarball"

      - name: Validate Linux ARM64 extension and htslib contract
        shell: Rscript {0}
        run: |
          stopifnot(tolower(Sys.info()[["machine"]]) %in% c("aarch64", "arm64"))
          config <- Rduckhts::rduckhts_htslib_config(validate = TRUE)
          print(config[c(
            "build_id", "duckdb_platform", "htslib_version",
            "runtime_version", "link", "library_file"
          )])
          stopifnot(
            identical(config$duckdb_platform, "linux_arm64"),
            endsWith(config$build_id, "-linux_arm64"),
            identical(config$runtime_version, config$htslib_version)
          )
          con <- Rduckhts::rduckhts_connect()
          on.exit(DBI::dbDisconnect(con, shutdown = TRUE), add = TRUE)
          platform <- DBI::dbGetQuery(con, "PRAGMA platform")[[1L]]
          stopifnot(identical(platform, "linux_arm64"))
          result <- tinytest::test_package(
            "Rduckhts",
            pattern = "^test_htslib_contract[.]R$"
          )
          print(result)
          stopifnot(
            length(result) > 0L,
            all(vapply(result, isTRUE, logical(1)))
          )

  windows-arm64-package:
    name: Windows ARM64 package contract
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DUCKHTS_STRICT_WARNINGS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: '45'
          # pak's CRAN source-cache validation requires Repository: CRAN;
          # R-universe rebuilds carry different repository metadata.
          cran: https://cloud.r-project.org
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rduckhts
          dependencies: '"hard"'
          extra-packages: any::tinytest
          install-pandoc: false

      - name: Build and audit clean source tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -f Rduckhts_*.tar.gz
          R CMD build --no-manual r/Rduckhts
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          Rscript scripts/audit_rduckhts_source_tarball.R "$tarball"

      - name: Install source tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD INSTALL "$tarball"

      - name: Validate Windows ARM64 extension and htslib contract
        shell: Rscript {0}
        run: |
          stopifnot(tolower(R.Version()[["arch"]]) %in% c("aarch64", "arm64"))
          config <- Rduckhts::rduckhts_htslib_config(validate = TRUE)
          print(config[c(
            "build_id", "duckdb_platform", "htslib_version",
            "runtime_version", "link", "library_file"
          )])
          stopifnot(
            identical(config$duckdb_platform, "windows_arm64_mingw"),
            endsWith(config$build_id, "-windows_arm64_mingw"),
            identical(config$runtime_version, config$htslib_version)
          )
          con <- Rduckhts::rduckhts_connect()
          on.exit(DBI::dbDisconnect(con, shutdown = TRUE), add = TRUE)
          platform <- DBI::dbGetQuery(con, "PRAGMA platform")[[1L]]
          stopifnot(identical(platform, "windows_arm64_mingw"))
          result <- tinytest::test_package(
            "Rduckhts",
            pattern = "^test_htslib_contract[.]R$"
          )
          print(result)
          stopifnot(
            length(result) > 0L,
            all(vapply(result, isTRUE, logical(1)))
          )
