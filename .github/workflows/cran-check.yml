# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  # Populate default-branch dependency caches that later PRs can restore.
  # PR merge-ref caches are otherwise private to that individual PR.
  push:
    branches: [main]
  pull_request:
    branches: [r_package, develop, main]
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  fedora-gcc16:
    runs-on: ubuntu-latest
    name: Fedora GCC 16 (R-devel)
    container:
      image: ghcr.io/r-hub/containers/gcc16:latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: /root/R-libs
          key: rduckhts-fedora-gcc16-${{ hashFiles('r/Rduckhts/DESCRIPTION') }}
          restore-keys: |
            rduckhts-fedora-gcc16-

      - name: Build and check in the CRAN Fedora environment
        env:
          DUCKHTS_FEDORA_CONTAINER: 1
        run: bash scripts/check_cran_fedora.sh

  fedora-clang:
    runs-on: ubuntu-latest
    name: Fedora 44 Clang 22 (CRAN-like)
    container:
      # Pinned Fedora 44 image; see scripts/check_cran_fedora.sh for the
      # compiler and CRAN-configuration receipt.
      image: fedora@sha256:6c75d5bf57cb0fa5aa4b92c6a83c86c791644496d9ac230de7711f5b8ec3b898

    steps:
      - uses: actions/checkout@v4

      - name: Cache Fedora Clang R dependencies
        uses: actions/cache@v4
        with:
          path: /root/R-libs
          # Never reuse a library built under another image/R/compiler profile.
          key: rduckhts-fedora-clang-${{ runner.arch }}-${{ hashFiles('.github/workflows/cran-check.yml', 'scripts/check_cran_fedora*.sh', 'r/Rduckhts/DESCRIPTION') }}

      - name: Build and check with warnings promoted to errors
        env:
          DUCKHTS_FEDORA_CONTAINER: 1
          DUCKHTS_FEDORA_PROFILE: clang
        run: bash scripts/check_cran_fedora_clang.sh

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release', rtools: '45'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
         # - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          rtools-version: ${{ matrix.config.rtools }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      #- name: Install system dependencies (macOS)
      #  if: runner.os == 'macOS'
      #  run: |
      #    brew install pkg-config curl gsl libdeflate bzip2 xz openssl

      - name: Reproduce CRAN M1Mac conversion diagnostics
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "DUCKHTS_CFLAGS=$(R CMD config CFLAGS) -Wconversion -Wno-sign-conversion" >> "$GITHUB_ENV"

      - name: Enable strict Windows native diagnostics
        if: runner.os == 'Windows'
        shell: bash
        run: echo "DUCKHTS_STRICT_WARNINGS=1" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          working-directory: r/Rduckhts

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
          working-directory: r/Rduckhts

      - name: Verify htslib header diagnostics stay outside DuckHTS compilation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          install_log=$(find r/Rduckhts -type f -path '*/Rduckhts.Rcheck/00install.out' -print -quit)
          test -n "$install_log"
          extension_log=$(mktemp)
          awk '/Building DuckHTS extension/ { extension = 1 } extension { print }' "$install_log" > "$extension_log"
          test -s "$extension_log"
          if grep -E 'htslib/htslib/[^:]+:[0-9]+:[0-9]+: (warning|error):' "$extension_log"; then
            echo "vendored htslib header diagnostics leaked into DuckHTS compilation" >&2
            exit 1
          fi

  linux-arm64-package:
    name: Linux ARM64 package contract
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DUCKHTS_STRICT_WARNINGS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rduckhts
          dependencies: '"hard"'
          extra-packages: any::tinytest
          install-pandoc: false

      - name: Build and audit clean source tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -f Rduckhts_*.tar.gz
          R CMD build --no-manual r/Rduckhts
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          Rscript scripts/audit_rduckhts_source_tarball.R "$tarball"

      - name: Install source tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD INSTALL "$tarball"

      - name: Validate Linux ARM64 extension and htslib contract
        shell: Rscript {0}
        run: |
          stopifnot(tolower(Sys.info()[["machine"]]) %in% c("aarch64", "arm64"))
          config <- Rduckhts::rduckhts_htslib_config(validate = TRUE)
          print(config[c(
            "build_id", "duckdb_platform", "htslib_version",
            "runtime_version", "link", "library_file"
          )])
          stopifnot(
            identical(config$duckdb_platform, "linux_arm64"),
            endsWith(config$build_id, "-linux_arm64"),
            identical(config$runtime_version, config$htslib_version)
          )
          con <- Rduckhts::rduckhts_connect()
          on.exit(DBI::dbDisconnect(con, shutdown = TRUE), add = TRUE)
          platform <- DBI::dbGetQuery(con, "PRAGMA platform")[[1L]]
          stopifnot(identical(platform, "linux_arm64"))
          result <- tinytest::test_package(
            "Rduckhts",
            pattern = "^test_htslib_contract[.]R$"
          )
          print(result)
          stopifnot(
            length(result) > 0L,
            all(vapply(result, isTRUE, logical(1)))
          )

  windows-arm64-package:
    name: Windows ARM64 package contract
    runs-on: windows-11-arm
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      DUCKHTS_STRICT_WARNINGS: 1

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          rtools-version: '45'
          # pak's CRAN source-cache validation requires Repository: CRAN;
          # R-universe rebuilds carry different repository metadata.
          cran: https://cloud.r-project.org
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rduckhts
          dependencies: '"hard"'
          extra-packages: any::tinytest
          install-pandoc: false

      - name: Build and audit clean source tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -f Rduckhts_*.tar.gz
          R CMD build --no-manual r/Rduckhts
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          Rscript scripts/audit_rduckhts_source_tarball.R "$tarball"

      - name: Install source tarball
        shell: bash
        run: |
          set -euo pipefail
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD INSTALL "$tarball"

      - name: Validate Windows ARM64 extension and htslib contract
        shell: Rscript {0}
        run: |
          stopifnot(tolower(R.Version()[["arch"]]) %in% c("aarch64", "arm64"))
          config <- Rduckhts::rduckhts_htslib_config(validate = TRUE)
          print(config[c(
            "build_id", "duckdb_platform", "htslib_version",
            "runtime_version", "link", "library_file"
          )])
          stopifnot(
            identical(config$duckdb_platform, "windows_arm64_mingw"),
            endsWith(config$build_id, "-windows_arm64_mingw"),
            identical(config$runtime_version, config$htslib_version)
          )
          con <- Rduckhts::rduckhts_connect()
          on.exit(DBI::dbDisconnect(con, shutdown = TRUE), add = TRUE)
          platform <- DBI::dbGetQuery(con, "PRAGMA platform")[[1L]]
          stopifnot(identical(platform, "windows_arm64_mingw"))
          result <- tinytest::test_package(
            "Rduckhts",
            pattern = "^test_htslib_contract[.]R$"
          )
          print(result)
          stopifnot(
            length(result) > 0L,
            all(vapply(result, isTRUE, logical(1)))
          )
