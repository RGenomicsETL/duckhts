name: Wasm Playwright smoke test

# Builds the duckdb-wasm extension via the same Docker path as the local
# `make wasm-playwright-test` and drives the browser harness headlessly with
# Playwright, asserting every complete SIMD dispatch kernel resolves to native
# wasm SIMD128 without scalar fallback and that the extension runs in a browser.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wasm-playwright:
    name: duckdb-wasm browser smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build duckdb-wasm extension + assemble site (Docker)
        run: SERVE=0 bash scripts/start_duckdb_wasm_local_test.sh

      - name: Install Playwright + browser
        working-directory: test/wasm
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run wasm smoke test
        working-directory: test/wasm
        env:
          DUCKHTS_WASM_SITE_ROOT: ${{ github.workspace }}/.duckdb-wasm-local-artifacts/site
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/wasm/playwright-report
          retention-days: 7
