name: pkgdown

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/Rduckhts
          extra-packages: any::pkgdown, any::litedown, any::devtools, any::roxygen2
          needs: website

      - name: Install Rduckhts from source tarball
        shell: bash
        run: |
          set -euo pipefail
          R CMD build --no-manual r/Rduckhts
          tarball=$(find . -maxdepth 1 -name 'Rduckhts_*.tar.gz' -print -quit)
          test -n "$tarball"
          R CMD INSTALL "$tarball"

      - name: Build two-level site
        run: make site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
