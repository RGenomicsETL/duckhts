      "r_wrapper": "rduckhts_simd_backend_available",
      "description": "Return whether a concrete SIMD backend is usable in the current process. Availability means the backend is compiled into DuckHTS and supported by the current CPU/runtime. auto is a selection request rather than a concrete backend and is not reported as available here.",
      "examples": [
        "SELECT duckhts_simd_backend_available('scalar');",
        "SELECT duckhts_simd_backend_available('avx2');",
        "SELECT duckhts_simd_backend_available('avx512');"
      ]
    },
    {
      "name": "duckhts_simd_info",
      "kind": "table",
      "category": "Diagnostics",
      "signature": "duckhts_simd_info()",
      "returns": "table",
      "r_wrapper": "rduckhts_simd_info",
      "description": "Report compiled, runtime-supported and selected status for each concrete DuckHTS SIMD backend.",
      "details": {
        "Diagnostics": "Rows include selectable, compiled, CPU-supported, available, selected, requested and dispatch-mode fields. available requires both compiled and CPU/runtime-supported. Explicit selection requires available=TRUE and a selectable implementation path. selected means at least one logical kernel uses that backend. auto is a request, not a concrete backend row."
      },
      "examples": [
        "SELECT * FROM duckhts_simd_info();",
        "SELECT backend FROM duckhts_simd_info() WHERE available;"
