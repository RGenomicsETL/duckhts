      "signature": "duckhts_htslib_version()",
      "returns": "VARCHAR",
      "r_wrapper": "rduckhts_htslib_version",
      "description": "Return the runtime version reported by the htslib library loaded with DuckHTS. Rduckhts uses this value to reject a downstream linking receipt whose source/header version does not match the loaded library.",
      "examples": [
        "SELECT duckhts_htslib_version();"
      ]
    },
    {
      "name": "duckhts_htslib_features",
      "kind": "scalar",
      "category": "Diagnostics",
      "signature": "duckhts_htslib_features()",
      "returns": "UINTEGER",
      "r_wrapper": "",
      "description": "Return the htslib runtime feature bitfield reported by hts_features(). Use duckhts_htslib_feature_string() for the corresponding build description.",
      "examples": [
        "SELECT duckhts_htslib_features();"
      ]
    },
    {
      "name": "duckhts_htslib_feature_string",
      "kind": "scalar",
      "category": "Diagnostics",
      "signature": "duckhts_htslib_feature_string()",
      "returns": "VARCHAR",
      "r_wrapper": "",
      "description": "Return htslib's runtime build-feature description, including configured transports, compression libraries, compiler, and build flags. DuckHTS snapshots it once while loading the extension so parallel SQL calls read immutable text.",
      "examples": [
        "SELECT duckhts_htslib_feature_string();"
      ]
    },
    {
