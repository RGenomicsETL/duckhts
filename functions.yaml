        "Relation to genotype evidence": "seq_error is an error of one read, and the reads of a site multiply. A site with balanced reads excludes both homozygous genotypes whatever seq_error is, and the read model has no term for a site whose reads do not reflect the sample's genotype. The read-count decode therefore corresponds to the GT decode with no tolerated genotype error: it ends a run at a heterozygous site that duckhts_roh with gt_error := 30 would pass through, and reports fewer bases in runs. benchmarks/benchmark_roh_counts_validation.md measures this on three 1000 Genomes samples.",
