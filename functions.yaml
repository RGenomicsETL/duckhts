      "name": "duckhts_contig_key",
      "kind": "scalar",
      "category": "Variants",
      "signature": "duckhts_contig_key(contig)",
      "returns": "VARCHAR",
      "r_wrapper": "",
      "details": {
        "Use": "Readers and region arguments compare contig names byte for byte. This function is the explicit key for a join of two sources that spell contigs differently: join on duckhts_contig_key(a.chrom) = duckhts_contig_key(b.chrom), or rename one side. Two names of one source can share a key (1 and chr1), so a join on the key repeats rows when one side has both. duckhts_roh_ancestry and the R ancestry wrappers use this key. Functions with another rule state it under Contig names.",
        "Not mapped": "Leading zeros (01 is not 1), numeric sex and mitochondrial codes (23, 24, 25, 26), accessions such as NC_000001.11, patches, alternate loci and unplaced scaffolds. The letter case of other names is kept."
      },
      "description": "Return a conservative contig join key by removing one non-empty leading chr prefix case-insensitively and normalizing M/MT to MT. X and Y are uppercased; all other suffixes are preserved. This does not map numeric sex chromosomes, accessions, patches, or alternate loci.",
      "examples": [
        "SELECT duckhts_contig_key('chr1'), duckhts_contig_key('chrM');"
      ]
    },
